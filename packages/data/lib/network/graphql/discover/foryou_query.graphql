query GetForYouData {
    getForYouData {
    success
    favoriteBusinesses {
      id
      name {
        key
        value
      }
      gallery{
        images{
          url
          featured
        }
      }
      branches {
        id
        name {
          key
          value
        }
        address{
          city
          address
          location
          latitude
          longitude
        }
      }
    }
    topProductsByBusiness {
      title
      subtitle
      items {
        id
        variantsId
        name {
          key
          value
        }
        featured
        loyaltyPoint
        membershipIds
        prices {
          price {
            amount
            currency
          }
        }
        gallery {
          images {
            url
          }
        }
        discounts {
          type
          value
          condition
          conditionValue
          startDate
          endDate
        }
        inventory {
          id
          qty
          unit
          minOrderQty
          maxOrderQty
          isAvailable
          optionsIncluded
        }
        business {
          id
          name {
            key
            value
          }
          discounts {
            name {
              key
              value
            }
            type
            value
            condition
            conditionValue
            startDate
            endDate
          }
        }
        variants{
          id
          prices {
            price {
              amount
              currency
            }
          }
        }
      }
    }

    bundles {
      title
      subtitle
      sequence
      items {
        id
        name {
          key
          value
        }
        description{
          key
          value
        }
        discount {
          type
          value
          condition
          conditionValue
        }
        startDate
        endDate
        productIds
        products {
          gallery {
            images {
              url
            }
          }
        }
      }
    }
  }
}