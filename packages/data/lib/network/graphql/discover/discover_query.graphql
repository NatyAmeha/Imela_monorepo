query GetDiscoveryData {
    getDiscoveryData() {
    success
    message
    productsResponse {
      title
      subtitle
      sequence
      items {
        id
        variantsId
        name {
          key
          value
        } 
        prices {
          price {
            amount
            currency
          }
        }
        gallery{
          images{
            url
          }
        }
        discounts {
          type
          value
          condition
          conditionValue
          startDate
          endDate
        }
        inventory {
          qty
          unit
          minOrderQty
          maxOrderQty
          isAvailable
          optionsIncluded
        }
        business{
          id
          name{
            key
            value
          }
          discounts {
            name {
              key
              value
            }
            type
            value
            condition
            conditionValue
            startDate
            endDate
          }
        }
        variants{
          id
          prices {
            price {
              amount
              currency
            }
          }
        }
      }
    }
    businessesResponse{
      title
      subtitle
      sequence
      items{
        id
        name{
          key
          value
        }
        gallery{
          images{
            url
            featured
          }
        }
      }
    }
    bundlesResponse{
      title
      subtitle
      sequence
      items{
        id
        name{
          key
          value
        }
        discount {
          type
          value
          condition
          conditionValue
        }
        productIds
        products {
          gallery {
            images {
              url
            }
          }
        }
      }
    }
  }
}