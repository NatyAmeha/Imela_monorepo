query GetCustomerBusinessLoyalty($businessId: String!) {
   getCustomerBusinessLoyality(businessId: $businessId) {
    success
    customer {
      id
      name
      userId
      phoneNumber
    }
    customerLoyalty {
      id
      name {
        key
        value
      }
      customerId
      businessId
      currentPoints
    }
    
  }
}