			id
			name {
				key
				value
			}
			description{
				key
				value
			}
			type
			startDate
			endDate
			productsInfo{
				productId
				minQty
				maxQty
			}
			gallery {
				images {
					url
				}
			}
			discount {
				type
				value
				condition
				conditionValue
			}
			businessIds
			businesses {
				id
				name {
					key
					value
				}
				paymentOptions{
					id
					name{
						key
						value
					}
					type
					upfrontPayment
					dueDate
        		}
			}
			createdAt
			updatedAt

			products {
				id
				name {
					key
					value
				}
				description {
					key
					value
				}
				prices {
          			price {
            			amount
            			currency
          			}
        		}
				gallery {
					images {
						featured
						url
					}
				}
				loyaltyPoint
				minimumOrderQty
				calendars {
					id
				}
				addons {
        			id
        			name {
          				key
          				value
        			}
        			inputType
					minAmount
					maxAmount
					tag
					isActive
					isRequired
					isProduct
					productIds
					checkCalendar
					calendarId
					membershipIds
					includeOnPOS
					additionalPrice {
						id
						amount
						currency
					}
      			}
				inventory {
					qty
					unit
					minOrderQty
					maxOrderQty
					isAvailable
					optionsIncluded
				}
				variants {
					id
					name {
						key
						value
					}
					gallery {
						images {
							featured
							url
						}
					}
					prices{
            			price{
              				amount
              				currency
            			}
          			}
					description {
						key
						value
					}
					inventory {
						qty
						unit
						minOrderQty
						maxOrderQty
						isAvailable
						optionsIncluded
        			}
				}

				business {
					name {
						key
						value
					}
				}
			}
			businesses {
				id
				name {
					value
				}
				type
			}
			branches {
				id
				name {
					value
				}
				business {
					name {
						value
					}
				}
			}
		}
	}


}