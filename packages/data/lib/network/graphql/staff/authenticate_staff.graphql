mutation AuthenticateStaff($phoneNumber: String!,  $businessId: String!, $pin: Float) {
  authenticateStaff(
    phoneNumber: $phoneNumber
    pin: $pin
    businessId: $businessId
  ) {
    success
    staff {
      id
      name
      pin
      phoneNumber
      roles
      isActive
      branch {
        id
        name {
          key
          value
        }
        address{
          id
          address
          city
          location
        }
        priceLists {
          id
          name {
            key
            value
          }
        }
      }
    }
  }

}