query GetBusinessCustomer($businessId: String!, $page: Float!, $limit: Float!) {
    getBusinessCustomers(businessId : $businessId, page : $page, limit : $limit){
    success
    customers{
      id
      name
      userId
      phoneNumber
      email
      customerLoyalties{
        id
        name{
          key
          value
        }
        customerId
        businessId
        currentPoints
        pointsSource{
          id
          name
          sourceId
          sourceType
          value
        }
        createdAt
        updatedAt
      }
    }
    
  }
}