query GetBusinessByWorkspace($workspace: String!, $branchId: String) {
  getBusinessByWorkspaceUrl(workspaceUrl: $workspace) {
    success
    business {
      id
      name {
        key
        value
      }
      workspaceUrl
      branches {
        id
        name {
          key
          value
        }
        phoneNumber
        staffsId
      }
      gallery{
        images{
          url
          featured
        }
      }
      isActive
      orderStatuses{
        id
        isDefault
        sequence
        status{ 
          key
          value
        }
        description{
          key
          value
        }
      }
      sections{
        id
        name {
          key
          value
        }
        productIds
        orderAddons {
          id
          name {
            key
            value
          }
          inputType
          minAmount
          maxAmount
          options {
            id
            name {
              key
              value
            }
            images
          }
          isActive
          isRequired
          additionalPrice {
            amount
            currency
          }
          isProduct
          productIds
          calendarId
          includeOnPOS
        }
      } 
      orderStatuses{
        id
        status{ 
          key
          value
        }
        description{
          key
          value
        }
      }
      discounts {
        type
        value
        condition
        conditionValue
        startDate
        endDate
      }
      bundles(branchId: $branchId){
        id
        name{
          key
          value
        }
        description{
          key
          value
        }
        productIds
        startDate
        endDate
        products{
          gallery{
            images{
              url
              featured
            }
          }
        }
      }
      paymentOptions {
        id
        name {
          key
          value
        }
        type
        upfrontPayment
        dueDate
        dueAfterDays
      }
    }
    
  }
} 