    }
    products {
      id
      name {
        key
        value
      }
      featured
      loyaltyPoint
      membershipIds
      prices {
        price {
          amount
          currency
        }
      }
      gallery {
        images {
          featured
          url
        }
      }
      discounts {
        type
        value
        condition
        conditionValue
        startDate
