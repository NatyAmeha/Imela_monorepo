      }
      discounts {
        id
        name{
          key
          value
        }
        type
        value
        condition
        conditionValue
        startDate
        endDate
      }
      bundles{
        id
        name{
          key
          value
        }
        description{
          key
          value
        }
        discount {
          type
          value
          condition
          conditionValue
        }
        productIds
        startDate
        endDate
        products{
          gallery{
            images{
              url
