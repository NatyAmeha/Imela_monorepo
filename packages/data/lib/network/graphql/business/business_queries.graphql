      isActive
      creator
      gallery{
        logoImage
        coverImage
        images{
          featured
          url
        }
        videos{
          featured
          url
        }
        
      }
      orderStatuses{
        id
        status{ 
          key
          value
        }
        description{
          key
          value
        }
      }
      sections {
        id
        name {
          key
          value
        }
        productIds
        images
        orderAddons {
          id
          name {
            key
            value
          }
          inputType
          minAmount
          maxAmount
