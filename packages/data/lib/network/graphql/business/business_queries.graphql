query GetBusinessDetails($id: String!, $branchId: String) {
  getBusinessDetails(id: $id, branchId: $branchId) {
    success
    message
    business {
      id
      totalViews
      name {
        key
        value
      }
      description{
        key
        value
      }
      type
      categories
      email
      phoneNumber
      mainAddress{
        city
        location
      }
      isActive
      creator
      gallery{
        logoImage
        coverImage
        images{
          featured
          url
        }
        videos{
          featured
          url
        }
        
      }
      orderStatuses{
        id
        status{ 
          key
          value
        }
        description{
          key
          value
        }
      }
      sections {
        id
        name {
          key
          value
        }
        productIds
        orderAddons {
          id
          name {
            key
            value
          }
          inputType
          minAmount
          maxAmount
          options {
            id
            name {
              key
              value
            }
            images
          }
          isActive
          isRequired
          additionalPrice {
            amount
            currency
          }
          isProduct
          productIds
          calendarId
          includeOnPOS
        }
      }
      discounts {
        id
        name{
          key
          value
        }
        type
        value
        condition
        conditionValue
        startDate
        endDate
      }
      bundles(branchId: $branchId){
        id
        name{
          key
          value
        }
        description{
          key
          value
        }
        productIds
        startDate
        endDate
        products{
          gallery{
            images{
              url
              featured
            }
          }
        }
      }
    }
    products {
      id
      name {
        key
        value
      }
      featured
      loyaltyPoint
      membershipIds
      prices {
        price {
          amount
          currency
        }
      }
      gallery {
        images {
          featured
          url
        }
      }
      discounts {
        type
        value
        condition
        conditionValue
        startDate
        endDate
      }
      inventory {
        qty
        unit
        minOrderQty
        maxOrderQty
        isAvailable
        optionsIncluded
      }
      variants{
        id
        prices {
          price {
            amount
            currency
          }
        }
      }
    }
    branches {
      id
      name {
        value
      }
    }
    memberships{
      id
      name{
        key
        value
      }
      membersProductIds
      groupsId
    }
    paymentOptions{
       id
      name{
        value
      }
      description{
        key
        value
      }
      type
      upfrontPayment
      dueDate
    }
    
  }
}