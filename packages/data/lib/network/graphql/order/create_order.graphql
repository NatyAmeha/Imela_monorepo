mutation CreateOrder($cartId : String, $businessIds: [String!]!,  $orderInput: CreateOrderInput!) {
    placeOrderFromOnlineStore(cartId: $cartId, businessIds: $businessIds, orderInput: $orderInput) {
        success
        message
        order {
            id
            userId
            businessId
            status
            code
            paymentType
            subTotal
            totalAmount
            remainingAmount
            paidAmount
            createdAt
            updatedAt
            paymentMethods {
                id
                name {
                    key
                    value
                }
                receiptImages
                amount {
                    amount
                    currency
                }
            }
            appliedRewards
            usedRewardsPoints
            discount {
                id
                amount
                name {
                    key
                    value
                }
            }
            items {
                id
                name {
                    key
                    value
                }
                quantity
                branchId
                productId
                subTotal
                discount {
                    id
                    amount
                    name {
                        key
                        value
                    }
                }
                branchId
                createdAt
                updatedAt
                config {
                    type
                    name {
                        key
                        value
                    }
                    singleValue
                    multipleValue
                    productIds
                }
            }
        }
    }

}