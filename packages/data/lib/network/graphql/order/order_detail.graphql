query OrderDetail($orderId: String!) {
  getOrderDetails(orderId: $orderId) {
    success
    order {
      id
      userId
      businessId
      status
      code
      paymentType
      subTotal
      totalAmount
      remainingAmount
      paidAmount
      createdAt
      updatedAt
      paymentMethods {
        id
        name {
          key
          value
        }
        receiptImages
        amount {
          amount
          currency
        }
      }
      discount {
        id
        amount
        name {
          key
          value
        }
      }
      items {
        id
        name {
          key
          value
        }
        quantity
        image
        point
        branchId
        productId
        subTotal
        discount {
          id
          amount
          name {
            key
            value
          }
        }

        branchId
        createdAt
        updatedAt
        config {
          type
          name {
            key
            value
          }
          singleValue
          multipleValue
          productIds
          additionalPrice
          addonId
        }
      }
      customer{
        id
        name
        phoneNumber
        userId
        redeemedRewards{
          rewardId
          pointUsed
          createdAt
        }
      }
      config {
          type
          name {
            key
            value
          }
          singleValue
          multipleValue
          productIds
          additionalPrice
          addonId
        }
    }
  }
}